[build]
  publish = "."

[[redirects]]
  from = "/thank-you.html"
  to = "/#prayer"
  status = 302
  force = true

[[redirects]]
  from = "/thank-you"
  to = "/#prayer"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
