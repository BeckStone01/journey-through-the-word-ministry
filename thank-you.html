<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prayer Request Received | Beacon Light Bible Church</title>
  <meta name="description" content="Thank you for sharing your prayer request with Beacon Light Bible Church Global Ministries." />
  <link rel="stylesheet" href="styles.css?v=20260513-layout3" />
  <style>
    html {
      box-sizing: border-box;
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit;
    }

    body.thank-you-page {
      margin: 0;
      min-height: 100vh;
      background: #f6f1e8;
      color: #191817;
      font-family: Arial, Helvetica, sans-serif;
    }

    .thank-you-wrap {
      width: 100%;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(24px, 5vw, 72px);
    }

    .thank-you-card {
      width: min(900px, 100%);
      margin: 0 auto;
      padding: clamp(28px, 5vw, 64px);
      background: rgba(255, 252, 245, 0.96);
      border: 1px solid rgba(28, 26, 22, 0.12);
      border-left: 6px solid #f7c62f;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.14);
    }

    .thank-you-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: clamp(32px, 5vw, 56px);
    }

    .thank-you-brand .logo-mark {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      background: #171717;
      color: #f7d66d;
      font-size: 1.5rem;
      font-weight: 900;
      line-height: 1;
    }

    .thank-you-brand strong {
      display: block;
      font-size: clamp(1.05rem, 2vw, 1.35rem);
      line-height: 1.1;
    }

    .thank-you-brand small {
      display: block;
      margin-top: 4px;
      color: #e55d39;
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .thank-you-card .eyebrow {
      margin: 0 0 10px;
      color: #e55d39;
      font-size: 0.82rem;
      font-weight: 900;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .thank-you-card h1 {
      max-width: 780px;
      margin: 0 0 18px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.4rem, 7vw, 5rem);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .thank-you-card > p:not(.eyebrow) {
      max-width: 760px;
      margin: 0;
      font-size: clamp(1rem, 1.6vw, 1.2rem);
      line-height: 1.6;
    }

    .thank-you-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    .thank-you-actions .button {
      min-height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
      border: 1px solid rgba(28, 26, 22, 0.16);
      color: #171717;
      font-size: 0.9rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .thank-you-actions .button-primary {
      background: #f7c62f;
    }

    .thank-you-actions .button-secondary {
      background: #171717;
      color: #fff;
    }

    @media (max-width: 640px) {
      .thank-you-wrap {
        place-items: start center;
        padding: 22px;
      }

      .thank-you-card {
        padding: 26px 20px;
      }

      .thank-you-actions .button {
        width: 100%;
      }
    }
  </style>
</head>
<body class="thank-you-page">
  <main class="thank-you-wrap">
    <section class="thank-you-card">
      <div class="brand thank-you-brand" aria-label="Beacon Light Bible Church Global Ministries">
        <span class="logo-mark">B</span>
        <span>
          <strong>Beacon Light Bible Church</strong>
          <small>Global Ministries</small>
        </span>
      </div>

      <p class="eyebrow">Prayer request received</p>
      <h1>Thank you for sharing your request.</h1>
      <p>
        Your prayer request has been received. Our ministry team will pray with care and confidence in God's faithfulness.
      </p>

      <div class="thank-you-actions">
        <a class="button button-primary" href="/">Return Home</a>
        <a class="button button-secondary" href="/#prayer">Send Another Request</a>
      </div>
    </section>
  </main>
</body>
</html>
